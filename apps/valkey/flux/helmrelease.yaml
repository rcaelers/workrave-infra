apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: valkey
  namespace: flux-system
spec:
  interval: 1h
  releaseName: valkey
  targetNamespace: guardrail
  install:
    createNamespace: true
  chart:
    spec:
      chart: valkey
      version: 1.0.0
      sourceRef:
        kind: HelmRepository
        name: valkey
        namespace: flux-system
  values:
    fullnameOverride: valkey
    auth:
      enabled: true
      usersExistingSecret: valkey-secrets
      aclUsers:
        default:
          permissions: "~* &* +@all"
          passwordKey: VALKEY_PASSWORD
    # Keep RollingUpdate explicit: the post-renderer below prevents concurrent
    # writers, and retaining the type avoids stale SSA rollingUpdate fields.
    deploymentStrategy: RollingUpdate
    persistence:
      enabled: true
      # Chart 1.x replaces dataStorage; keep the same PVC name and storage.
      size: 5Gi
      storageClass: local-path-retain
      keepOnUninstall: true
    resources:
      limits:
        cpu: "500m"
        memory: "512Mi"
      requests:
        cpu: "100m"
        memory: "128Mi"
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: valkey
            patch: |-
              - op: add
                path: /spec/template/metadata/annotations
                value:
                  secret.reloader.stakater.com/reload: "valkey-secrets"
              # Never run two pods against the same data volume: stop the old
              # pod before starting the new one. (Switching the type to
              # Recreate fails under server-side apply, which keeps the live
              # rollingUpdate fields.)
              - op: add
                path: /spec/strategy/rollingUpdate
                value:
                  maxSurge: 0
                  maxUnavailable: 1
