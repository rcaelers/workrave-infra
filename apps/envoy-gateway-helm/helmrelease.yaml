apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway-helm
  namespace: flux-system
spec:
  interval: 1h
  releaseName: envoy-gateway-helm
  targetNamespace: envoy-gateway-system
  install:
    createNamespace: true
    crds: Skip
  upgrade:
    crds: Skip
  chart:
    spec:
      chart: gateway-helm
      version: 1.9.2
      sourceRef:
        kind: HelmRepository
        name: envoy-gateway-helm
        namespace: flux-system
  values:
    crds:
      enabled: false
