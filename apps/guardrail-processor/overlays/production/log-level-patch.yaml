apiVersion: apps/v1
kind: Deployment
metadata:
  name: guardrail-processor
spec:
  template:
    spec:
      containers:
        - name: guardrail-processor
          env:
            - name: RUST_LOG
              # The crate is named processor; guardrail=info alone would drop
              # everything it logs.
              value: "guardrail=info,processor=info,apalis=info,apalis_redis=info"
