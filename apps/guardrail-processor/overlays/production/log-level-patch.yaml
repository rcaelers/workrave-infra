apiVersion: apps/v1
kind: Deployment
metadata:
  name: guardrail-processor
spec:
  template:
    spec:
      containers:
        - name: guardrail-processor
          env:
            - name: RUST_LOG
              # Each crate logs under its own name: processor, and common for the shared
              # code (queue preparation, worker failures); guardrail=info alone
              # would drop what they log.
              value: "guardrail=info,processor=info,common=info,apalis=info,apalis_redis=info"
