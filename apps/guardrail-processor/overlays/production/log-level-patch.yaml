apiVersion: apps/v1
kind: Deployment
metadata:
  name: guardrail-processor
spec:
  template:
    spec:
      containers:
        - name: guardrail-processor
          env:
            - name: RUST_LOG
              # processor=debug is temporary, to find out why symbols for the
              # MinGW DLLs are never applied: the symbol supplier lives in the
              # processor crate, so guardrail=info alone discards everything it
              # logs, including which paths it looks a module up under.
              value: "guardrail=info,processor=debug,apalis=info,apalis_redis=info"
