apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: guardrail-processor-network-policy
spec:
  podSelector:
    matchLabels:
      app: guardrail-processor
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Gatus and Kener health checks; kubelet probes do not need a rule.
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchExpressions:
          - key: app
            operator: In
            values: [gatus, kener]
    ports:
    - protocol: TCP
      port: 9090
  egress:
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: valkey
          app.kubernetes.io/instance: valkey
    ports:
    - protocol: TCP
      port: 6379
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: garage
      podSelector:
        matchLabels:
          app.kubernetes.io/name: garage
          app.kubernetes.io/instance: garage
    ports:
    - protocol: TCP
      port: 3900
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
