apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-gateway-crd-resources
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  # Only Envoy's CRDs. k3s owns the standard Gateway API CRDs and policies.
  path: ./gateway-helm/charts/crds/crds/generated
  # Deleting a CRD also deletes every instance of it; keep schemas on removal.
  prune: false
  wait: true
  timeout: 5m
  sourceRef:
    kind: OCIRepository
    name: envoy-gateway-crds
