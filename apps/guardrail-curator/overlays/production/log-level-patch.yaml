apiVersion: apps/v1
kind: Deployment
metadata:
  name: guardrail-curator
spec:
  template:
    spec:
      containers:
        - name: guardrail-curator
          env:
            - name: RUST_LOG
              # The crate is named curator; guardrail=info alone would drop
              # everything it logs.
              value: "guardrail=info,curator=info,apalis=info,apalis_redis=info"
