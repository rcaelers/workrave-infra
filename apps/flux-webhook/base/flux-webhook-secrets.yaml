kind: SopsSecret
metadata:
  name: flux-webhook-sop-secrets
spec:
  secretTemplates:
    - name: flux-webhook-token
      labels:
        # notification-controller only re-reads a Receiver's secret on its
        # 10m interval unless the secret carries this label, in which case it
        # watches it and recomputes .status.webhookPath immediately. That
        # matters on rotation: the path is sha256(token+name+namespace), so a
        # new token means a new URL, and the sooner it settles the shorter the
        # window where the GitHub hook points at a dead path.
