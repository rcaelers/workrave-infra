apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - kener-secrets.yaml
  - deployment.yaml
  - service.yaml
  - pvc.yaml
  - pocket-id-setup-rbac.yaml
# The name hash rolls the pod on every change, which reruns config.mjs.
configMapGenerator:
  - name: kener-config
    files:
      - config/config.mjs
      - config/kener.json
