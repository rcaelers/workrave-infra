apiVersion: isindir.github.com/v1alpha3
kind: SopsSecret
metadata:
  name: kener-secrets
spec:
  secretTemplates:
    - name: kener-secrets
      stringData:
        # openssl rand -base64 32
        KENER_SECRET_KEY: "%KENER_SECRET_KEY%"
        # Created in Kener under Manage > API Keys; empty until then, which
        # leaves the kener-sync job a no-op.
        KENER_API_KEY: "%KENER_API_KEY%"
