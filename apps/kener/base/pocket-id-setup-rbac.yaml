# Lets the Pocket ID setup job (guardrail-setup-pocket-id) store the Kener
# OIDC client secret in this namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pocket-id-setup-kener
rules:
  # create cannot be limited by name.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["kener-oidc"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pocket-id-setup-kener
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pocket-id-setup-kener
subjects:
  - kind: ServiceAccount
    name: pocket-id-setup
    namespace: guardrail
