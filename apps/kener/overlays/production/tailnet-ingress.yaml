apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kener-tailnet
  annotations:
    tailscale.com/proxy-group: ingress-proxies
    # Same tag Gatus used for this hostname, so existing ACL grants still apply.
    tailscale.com/tags: tag:shared-gatus
spec:
  defaultBackend:
    service:
      name: kener
      port:
        name: http
  ingressClassName: tailscale
  tls:
    - hosts:
        - status
